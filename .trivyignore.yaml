misconfigurations:
  - id: AVD-AWS-0053
    paths:
      - "infra/edge.tf"
    statement: The internet-facing ALB is the intended public HTTPS entry point; ECS only accepts traffic from its security group.
  - id: AVD-AWS-0164
    paths:
      - "infra/network.tf"
    statement: Public subnets and task public IPs are an accepted cost trade-off that avoids NAT; task ingress remains restricted to the ALB security group.
  - id: AVD-AWS-0132
    paths:
      - "infra/storage.tf"
    statement: The media bucket uses private SSE-S3 encryption; a customer-managed KMS key is outside the accepted project scope.
  - id: AVD-AWS-0136
    paths:
      - "infra/monitoring.tf"
    statement: The operations topic uses the AWS-managed SNS key; a customer-managed KMS key is outside the accepted project scope.
  - id: AVD-AWS-0104
    paths:
      - "infra/network.tf"
    statement: Tasks require public HTTPS access to regional AWS APIs without NAT or VPC endpoints; all-protocol egress is prohibited and database egress is security-group scoped.
